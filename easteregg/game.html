<script>

  window.addEventListener('DOMContentLoaded', () => {
  // A legelső <li> elem (Kalandor 1)
  const firstGameLi = document.querySelector('#game-list li');

  // Most a "Magyar" gomb van elöl → index 0
  const defaultBtn = firstGameLi.querySelectorAll('button')[0];

  // Meghívjuk a selectGame függvényt, hogy kijelölje
  if (defaultBtn) selectGame(defaultBtn, 'logic1.js', 'hun');

  const image = document.getElementById('image');
    image.src = 'trilogy.jpg';
    image.style.display = 'inline';
});

    function toggleSound() {
      window.soundEnabled = document.getElementById('hangCheckbox').checked;
    }
  
 
let selectedGame = 'logic1.js';
let selectedLang = 'hun';

function toggleSound() {
  window.soundEnabled = document.getElementById('hangCheckbox').checked;
}

function selectGame(button, game, lang) {
  selectedGame = game;
  selectedLang = lang;

  // Eltávolítjuk a kijelöléseket
  document.querySelectorAll('#game-list button').forEach(btn => {
    btn.classList.remove('selected');
  });

  // Kiemeljük a kiválasztott gombot
  button.classList.add('selected');
}

function startSelectedGame() {
  window.language = selectedLang;
  window.soundEnabled = document.getElementById('hangCheckbox').checked;

  const oldScript = document.getElementById("game-script");
  if (oldScript) oldScript.remove();

  const script = document.createElement("script");
  script.src = selectedGame;
  script.id = "game-script";

  script.onload = () => {
    if (typeof updateUI === 'function') updateUI();
  };

  document.body.appendChild(script);
}

  </script>
